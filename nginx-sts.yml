apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: busy
  name: busy
spec:
  replicas: 10
  selector:
    matchLabels:
      app: busy
  template:
    metadata:
      labels:
        app: busy
    spec:
      containers:
      - image: busybox:1.28
        name: busy
        command:
          - sh
          - -c
          - sleep 3600
