apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wwwphp
  name: wwwphp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wwwphp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: wwwphp
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-wk1
      containers:
      - image: nginx:1.27
        name: nginx
        resources: {}
        env:
          - name: STAGE
            value: Docker
          - name: SITE
            valueFrom:
              configMapKeyRef:
                name: wwwphp-env
                key: SITE
          - name: monIP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        livenessProbe:
          httpGet:
            port: 80
            path: /index.html
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            port: 80
            path: /index.html
          periodSeconds: 3
          failureThreshold: 4
        envFrom:
          - configMapRef:
              name: wwwphp-env
          - secretRef:
              name: test
        volumeMounts:
          - name: nfsshare
            mountPath: /usr/share/nginx/html
            subPath: html
            readOnly: true
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d
      - image: php:8.2-fpm
        name: php
        volumeMounts:
          - name: nfsshare
            mountPath: /var/www/html
            subPath: html
            readOnly: true

      volumes:
        - name: nfsshare
          nfs:
            server: 192.168.56.200
            path: /
        - name: nginx-conf
          configMap:
            name: nginx-conf
