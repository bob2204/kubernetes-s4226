apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wwwphp
  name: wwwphp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wwwphp
  template:
    metadata:
      labels:
        app: wwwphp
    spec:
      containers:
      - image: nginx:1.28
        name: nginx
        resources: {}
        env:
          - name: STAGE
            value: Docker
          - name: SITE
            valueFrom:
              configMapKeyRef:
                name: wwwphp-env
                key: SITE
          - name: monIP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        livenessProbe:
          httpGet:
            port: 80
            path: /index.html
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            port: 80
            path: /index.html
          periodSeconds: 3
          failureThreshold: 4
        envFrom:
          - configMapRef:
              name: wwwphp-env
          - secretRef:
              name: test
      - image: php:8.2-fpm
        name: php
