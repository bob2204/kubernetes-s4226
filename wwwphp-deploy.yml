apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wwwphp
  name: wwwphp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wwwphp
  strategy: {}
  template:
    metadata:
      labels:
        app: wwwphp
    spec:
      containers:
      - image: nginx:1.28
        name: nginx
        resources: {}
        env:
          - name: STAGE
            value: Kubernetes
          - name: SITE
            valueFrom:
              configMapKeyRef:
                name: wwwphp-env
                key: SITE
          - name: monIP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        envFrom:
          - configMapRef:
              name: wwwphp-env
      - image: php:8.2-fpm
        name: php
        resources: {}
status: {}
