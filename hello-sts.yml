apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: hello
  name: hello
spec:
  replicas: 3
  serviceName: hello
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      initContainers:
      - name: status
        image: busybox:1.28
        command:
          - sh
          - -c
          - |
            nb=$(hostname | cut -d- -f2)
            if [ $nb -eq 0 ]
            then
              echo "Primaire" > /mnt/status
            else
              echo "Secondaire n°$nb" > /mnt/status
            fi
        volumeMounts:
          - name: status
            mountPath: /mnt
      containers:
      - image: bob2606/hello-http:0.8.41
        name: hello-http
        envFrom:
          - configMapRef:
              name: hello-env
        env:
          - name: NODENAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        ports:
          - name: http
            containerPort: 80
        volumeMounts:
          - name: status
            mountPath: /var/lib/hello-http

      volumes:
        - name: status
          emptyDir:
            medium: Memory
