apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hello
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
      - image: bob2606/hello-http:0.8.41
        name: hello-http
        envFrom:
          - configMapRef:
              name: hello-env
        env:
          - name: NODENAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        ports:
          - name: http
            containerPort: 80
        livenessProbe:
          httpGet:
            path: /livez
            port: 80
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 80
          periodSeconds: 4
          failureThreshold: 3
        volumeMounts:
          - name: status
            mountPath: /var/lib/hello-http

      volumes:
        - name: status
          nfs:
            server: 192.168.56.200
            path: /hello-http
