apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - dev-ns.yml

#namePrefix: dev-
#nameSuffix: -dev
namespace: dev

images:
  - name: nginx
    newTag: "1.31"

labels:
  - pairs:
      env: dev
    includeSelectors: true

configMapGenerator:
  - name: nginx-env
    envs:
      - nginx.env
  - name: nginx-conf
    envs:
      - nginx.conf

patches:
  - path: nginx-resources.yml
  - path: nginx-volumes.yml
    #- path: nginx-mountpath.yml

replacements:
  - source:
      kind: ConfigMap
      name: nginx-conf
      fieldPath: data.PORT
    targets:
      - select:
          kind: Deployment
          name: nginx
        fieldPaths:
          - spec.template.spec.containers.0.ports.0.containerPort
